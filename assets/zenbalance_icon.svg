<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e6d3"/>
      <stop offset="100%" style="stop-color:#e8d5b7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e8c547;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#e8c547" stroke-width="1" opacity="0.15"/>

  <!-- Inner glow ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#e8c547" stroke-width="0.5" opacity="0.1"/>

  <!-- Moon / circle -->
  <circle cx="256" cy="256" r="100" fill="url(#moon)" opacity="0.95"/>

  <!-- Subtle moon texture dots -->
  <circle cx="220" cy="230" r="4" fill="#d4c4a8" opacity="0.4"/>
  <circle cx="240" cy="210" r="2.5" fill="#d4c4a8" opacity="0.3"/>
  <circle cx="280" cy="240" r="3" fill="#d4c4a8" opacity="0.35"/>
  <circle cx="260" cy="280" r="2" fill="#d4c4a8" opacity="0.25"/>
  <circle cx="230" cy="270" r="1.5" fill="#d4c4a8" opacity="0.3"/>

  <!-- Lotus petal - center -->
  <path d="M256 310 Q256 250 230 200 Q256 230 256 260 Q256 230 282 200 Q256 250 256 310Z"
        fill="#e8c547" opacity="0.85"/>

  <!-- Lotus petal - left -->
  <path d="M256 290 Q230 250 195 215 Q225 240 240 265 Q235 255 256 290Z"
        fill="#e8c547" opacity="0.6"/>

  <!-- Lotus petal - right -->
  <path d="M256 290 Q282 250 317 215 Q287 240 272 265 Q277 255 256 290Z"
        fill="#e8c547" opacity="0.6"/>

  <!-- Lotus petal - far left -->
  <path d="M240 270 Q210 240 180 230 Q210 245 230 260 Q225 255 240 270Z"
        fill="#e8c547" opacity="0.35"/>

  <!-- Lotus petal - far right -->
  <path d="M272 270 Q302 240 332 230 Q302 245 282 260 Q287 255 272 270Z"
        fill="#e8c547" opacity="0.35"/>

  <!-- Small star dots -->
  <circle cx="160" cy="140" r="2" fill="#e8c547" opacity="0.6"/>
  <circle cx="350" cy="130" r="1.5" fill="#e8c547" opacity="0.5"/>
  <circle cx="380" cy="180" r="1" fill="#e8c547" opacity="0.4"/>
  <circle cx="140" cy="200" r="1.5" fill="#e8c547" opacity="0.45"/>
  <circle cx="370" cy="300" r="1" fill="#e8c547" opacity="0.3"/>
  <circle cx="150" cy="320" r="1.2" fill="#e8c547" opacity="0.35"/>
  <circle cx="200" cy="150" r="1" fill="#e8c547" opacity="0.4"/>
  <circle cx="310" cy="160" r="1.3" fill="#e8c547" opacity="0.35"/>

  <!-- Tiny sparkle crosses -->
  <path d="M340 150 L340 156 M337 153 L343 153" stroke="#e8c547" stroke-width="1" opacity="0.5" fill="none"/>
  <path d="M170 170 L170 176 M167 173 L173 173" stroke="#e8c547" stroke-width="1" opacity="0.4" fill="none"/>
  <path d="M360 250 L360 256 M357 253 L363 253" stroke="#e8c547" stroke-width="1" opacity="0.3" fill="none"/>
</svg>
